<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
  <title id="title">書類選考結果のメールが並ぶスマートフォン</title>
  <desc id="desc">転職活動中に届く選考結果メールを匿名化して表現した、AIKASU LP用のヒーロー素材</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#243238" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g transform="translate(235 80) rotate(-2 365 610)" filter="url(#shadow)">
    <rect width="730" height="1240" rx="92" fill="#243238"/>
    <rect x="22" y="22" width="686" height="1196" rx="74" fill="#FCFCFA"/>
    <rect x="286" y="42" width="158" height="32" rx="16" fill="#243238"/>
    <text x="70" y="115" fill="#243238" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="26" font-weight="600">9:41</text>
    <text x="660" y="115" text-anchor="end" fill="#657277" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="23">● ● ●</text>
    <line x1="48" y1="145" x2="682" y2="145" stroke="#E2E5E3"/>
    <text x="70" y="210" fill="#243238" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="42" font-weight="700">受信トレイ</text>
    <rect x="570" y="169" width="92" height="52" rx="26" fill="#CDE6F8"/>
    <text x="616" y="204" text-anchor="middle" fill="#1F6B99" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="22" font-weight="700">10件</text>

    <g transform="translate(48 255)">
      <rect width="634" height="172" rx="22" fill="#FFF7F5" stroke="#E6B4AA" stroke-width="2"/>
      <circle cx="42" cy="48" r="8" fill="#D9776A"/>
      <text x="68" y="55" fill="#243238" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="27" font-weight="700">選考結果のご連絡</text>
      <text x="590" y="55" text-anchor="end" fill="#89918F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20">今日</text>
      <text x="68" y="98" fill="#657277" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="23">採用ご担当者</text>
      <text x="68" y="137" fill="#657277" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="21">慎重に選考を行いました結果、誠に残念ながら…</text>
    </g>

    <g transform="translate(48 445)">
      <rect width="634" height="152" rx="20" fill="#FFFFFF"/>
      <circle cx="42" cy="44" r="8" fill="#D9776A"/>
      <text x="68" y="51" fill="#243238" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="26" font-weight="650">書類選考結果について</text>
      <text x="590" y="51" text-anchor="end" fill="#89918F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20">昨日</text>
      <text x="68" y="93" fill="#657277" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="22">採用事務局</text>
      <text x="68" y="127" fill="#89918F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20">このたびはご応募いただき、ありがとうございました…</text>
      <line x1="0" y1="151" x2="634" y2="151" stroke="#E8EAE8"/>
    </g>

    <g transform="translate(48 615)">
      <rect width="634" height="152" rx="20" fill="#FFFFFF"/>
      <text x="68" y="51" fill="#243238" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="26" font-weight="600">ご応募ありがとうございました</text>
      <text x="590" y="51" text-anchor="end" fill="#89918F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20">月曜</text>
      <text x="68" y="93" fill="#657277" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="22">人事採用チーム</text>
      <text x="68" y="127" fill="#89918F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20">厳正なる選考の結果、今回はご希望に添えず…</text>
      <line x1="0" y1="151" x2="634" y2="151" stroke="#E8EAE8"/>
    </g>

    <g transform="translate(48 785)">
      <rect width="634" height="152" rx="20" fill="#FFFFFF"/>
      <text x="68" y="51" fill="#243238" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="26" font-weight="600">選考結果のお知らせ</text>
      <text x="590" y="51" text-anchor="end" fill="#89918F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20">8/15</text>
      <text x="68" y="93" fill="#657277" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="22">採用窓口</text>
      <text x="68" y="127" fill="#89918F" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="20">今後のご活躍を心よりお祈り申し上げます…</text>
      <line x1="0" y1="151" x2="634" y2="151" stroke="#E8EAE8"/>
    </g>

    <g transform="translate(48 955)">
      <rect width="634" height="150" rx="20" fill="#F4F7F6"/>
      <text x="317" y="60" text-anchor="middle" fill="#657277" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="22">応募した企業</text>
      <text x="317" y="113" text-anchor="middle" fill="#243238" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans JP', sans-serif" font-size="42" font-weight="800">10社　面接 0件</text>
    </g>
    <rect x="274" y="1159" width="182" height="8" rx="4" fill="#243238" opacity="0.7"/>
  </g>
</svg>
